rules:
  - id: detect-hardcoded-api-key
    patterns:
      - pattern: $VAR = "sk_test$REST"
      - metavariable-pattern:
          metavariable: $VAR
          pattern: $KEY
    message: "Hardcoded API key detected"
    languages: [php]
    severity: ERROR

  - id: detect-dynamic-sql-query
    pattern: DB::select("SELECT $REST")
    message: "Raw SQL query detected — use parameterized queries"
    languages: [php]
    severity: ERROR
