name: DAST - OWASP ZAP

on:
  pull_request:
    branches:
      - develop
      - release

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: "https://demo.firefly-iii.org"
          cmd_options: "-a -m 2 -r zap_report.html -w zap_report.md -J zap_report.json"

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap_report.html
            zap_report.md
            zap_report.json
